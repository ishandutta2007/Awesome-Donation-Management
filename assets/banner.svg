<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        font-size: 54px;
        fill: url(#text-grad);
      }
      .subtitle {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 20px;
        fill: #94a3b8;
        letter-spacing: 1px;
      }
      .tag {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      
      /* Dynamic Animated Background Elements */
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(3deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(12px) scale(1.05); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      
      .floating-bg-1 { animation: float1 8s ease-in-out infinite; }
      .floating-bg-2 { animation: float2 6s ease-in-out infinite; }
      .pulsing-glow { animation: pulse 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Geometric Elements (Behind Text) -->
  <g class="pulsing-glow">
    <circle cx="150" cy="80" r="180" fill="url(#accent-glow)"/>
    <circle cx="1050" cy="240" r="220" fill="url(#accent-glow)"/>
  </g>

  <g class="floating-bg-1" opacity="0.15">
    <path d="M 900,50 L 1100,50 L 1050,180 L 850,180 Z" fill="#818cf8"/>
    <circle cx="200" cy="240" r="60" fill="#38bdf8"/>
  </g>

  <g class="floating-bg-2" opacity="0.12">
    <rect x="80" y="40" width="120" height="120" rx="20" fill="#c084fc"/>
    <path d="M 750,200 L 850,280 L 650,280 Z" fill="#38bdf8"/>
  </g>

  <!-- Decorative Grid Overlay -->
  <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M 300,0 L 300,320 M 600,0 L 600,320 M 900,0 L 900,320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Foreground Content (Always Crisp & Visible) -->
  <g transform="translate(80, 115)">
    <!-- Pill Badge -->
    <g transform="translate(0, -50)">
      <rect width="250" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" class="tag">🎁 DONATION &amp; FUNDRAISING</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="20" class="title" filter="url(#glow)">Awesome Donation Management</text>
    
    <!-- Subtitle -->
    <text x="0" y="65" class="subtitle">Curated SaaS Platforms, Open-Source CRM &amp; Church Giving Ecosystems</text>
  </g>

  <!-- Bottom Decorative Accent Line -->
  <rect x="80" y="270" width="1040" height="3" rx="1.5" fill="url(#text-grad)" opacity="0.8"/>
</svg>
